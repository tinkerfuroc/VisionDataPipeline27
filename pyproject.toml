[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsp"
version = "0.1.0"
description = "SAM3 video labeling pipeline with an interactive web GUI."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<6",
    "pillow>=10",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "torch==2.14.0+cu126",
    "torchvision==0.29.0+cu126",
    "transformers==5.17.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pycocotools>=2.0.11",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
vsp = "vsp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["server/vsp"]

[tool.uv]
# torch "+cu126" wheels do not exist for macOS; restrict the lock to this platform.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["server/tests"]
markers = ["gpu: needs CUDA and the converted SAM3 checkpoint"]
filterwarnings = [
    "ignore:`torch\\.jit\\.script` is deprecated\\. Please switch to `torch\\.compile` or `torch\\.export`\\.:FutureWarning",
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead\\.:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
