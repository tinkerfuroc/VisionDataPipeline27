server:    {host: 127.0.0.1, port: 28000, https: false}   # https: also `vdp serve --https`; cert/key: your own pair
project:   {data_root: ./data}
ingest:
  allowed_roots: ["~"]
  default_stride: 1
  jpeg_quality: 95
  thumb_width: 160
  max_upload_bytes: 8589934592   # 8 GiB; a larger upload is refused (413)
  max_zip_entries: 100000
  max_zip_bytes: 68719476736     # 64 GiB uncompressed total inside one zip
sam3:
  model_dir: ./vision_train/sam3_checkpoint_hf
  device: auto          # first CUDA device with compute capability >= 8.0; or "cuda:N"
  dtype: bfloat16
  text_threshold: 0.45
  box_threshold: 0.4
  score_mode: native    # "per_query" drops the presence multiplier for verbose prompts
propagate: {chunk_size: 24, min_chunk_size: 4, lost_after: 15}
export:    {val_fraction: 0.2, min_area_px: 64}
augment:   {workers: null}   # augmentation processes; null = CPU cores minus 4 (min 1), 1 = no worker processes
